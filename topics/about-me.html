<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Me - MaximumTrainer</title>
  <style>
    :root {
      --bg: #fafafa;
      --bg-card: #ffffff;
      --text: #1a1a2e;
      --text-muted: #555;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #e2e8f0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --bg-card: #1e293b;
        --text: #e2e8f0;
        --text-muted: #94a3b8;
        --accent: #60a5fa;
        --accent-hover: #93bbfd;
        --border: #334155;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    nav {
      padding: 1.25rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    article {
      padding: 2.5rem 0;
    }

    article h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }

    .placeholder {
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 2.5rem;
      text-align: center;
      color: var(--text-muted);
    }

    .placeholder p {
      margin-bottom: 0.5rem;
    }

    .placeholder p:last-child {
      font-size: 0.875rem;
      font-style: italic;
    }

    footer {
      padding: 2rem 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <div class="container">

    <nav>
      <a href="/">&larr; Home</a>
    </nav>

    <article>
      <h1>About Me</h1>
      <div class="placeholder">
        <p>This page is a work in progress.</p>
        <p>Edit topics/about-me.html to add your background, interests, and story.</p>
      </div>
    </article>

    <footer>
      <p>&copy; 2026 MaximumTrainer</p>
    </footer>

  </div>

</body>
</html>
